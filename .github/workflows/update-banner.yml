name: Update banner stats
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["assets/banner.template.svg", "scripts/update_stats.py"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_stats.py
        env:
          GH_USER: g4zwr
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add g4zwr-banner.svg
          git diff --staged --quiet || (git commit -m "chore: update banner stats" && git push)
