<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="100%" height="100%">
  <style>
    /* Matrix Rain Animation */
    @keyframes fall {
      0% { transform: translateY(-100%); opacity: 0; }
      10% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(120%); opacity: 0; }
    }
    .rain {
      fill: #ffffff; /* White text */
      font-family: monospace;
      font-size: 16px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      animation: fall linear infinite;
    }
    
    /* Staggered animation timings for a natural effect */
    .d1 { animation-duration: 4s; animation-delay: -1s; }
    .d2 { animation-duration: 6s; animation-delay: -3s; }
    .d3 { animation-duration: 5s; animation-delay: -2s; }
    .d4 { animation-duration: 7s; animation-delay: -5s; }
    .d5 { animation-duration: 4.5s; animation-delay: -0.5s; }
    .d6 { animation-duration: 5.5s; animation-delay: -4s; }
  </style>

  <!-- Solid Black Background -->
  <rect width="100%" height="100%" fill="#000000" />

  <!-- Background Rain Layer -->
  <g class="matrix-bg" opacity="0.6">
    <text x="20" y="0" class="rain d1">1 0 ｱ ｲ ｳ ｴ 1 0 1 ｶ ｷ ｸ ｹ 1 0</text>
    <text x="60" y="0" class="rain d2">ｶ ｷ ｸ 1 0 ｱ ｲ ｳ ｴ 1 0 1 ｹ 1 0</text>
    <text x="100" y="0" class="rain d3">1 0 1 0 ｱ ｲ ｳ ｴ ｶ ｷ ｸ ｹ 1 0</text>
    <text x="140" y="0" class="rain d4">ｻ ｼ ｽ ｾ 0 1 0 1 ｿ ﾀ ﾁ ﾂ 1 0</text>
    <text x="180" y="0" class="rain d5">1 0 ﾏ ﾐ ﾑ ﾒ ﾓ 1 0 1 0 ﾔ ﾕ ﾖ</text>
    <text x="220" y="0" class="rain d6">ﾊ ﾋ ﾌ ﾍ ﾎ 1 0 1 0 ﾏ ﾐ ﾑ ﾒ ﾓ</text>
    <text x="260" y="0" class="rain d1">1 0 1 0 ｱ ｲ ｳ ｴ ｶ ｷ ｸ ｹ 1 0</text>
    <text x="300" y="0" class="rain d3">0 1 0 1 ｻ ｼ ｽ ｾ 1 0 1 ｿ ﾀ ﾁ</text>
    <text x="340" y="0" class="rain d2">ｱ ｲ ｳ ｴ 1 0 1 ｶ ｷ ｸ ｹ 1 0 1</text>
    <text x="380" y="0" class="rain d5">1 0 ﾏ ﾐ ﾑ ﾒ ﾓ 1 0 1 0 ﾔ ﾕ ﾖ</text>
    <text x="420" y="0" class="rain d4">ﾊ ﾋ ﾌ ﾍ ﾎ 1 0 1 0 ﾏ ﾐ ﾑ ﾒ ﾓ</text>
    <text x="460" y="0" class="rain d6">ｶ ｷ ｸ 1 0 ｱ ｲ ｳ ｴ 1 0 1 ｹ 1</text>
    <text x="500" y="0" class="rain d1">1 0 1 0 ｱ ｲ ｳ ｴ ｶ ｷ ｸ ｹ 1 0</text>
    <text x="540" y="0" class="rain d3">0 1 0 1 ｻ ｼ ｽ ｾ 1 0 1 ｿ ﾀ ﾁ</text>
    <text x="580" y="0" class="rain d2">1 0 ｱ ｲ ｳ ｴ 1 0 1 ｶ ｷ ｸ ｹ 1</text>
    <text x="620" y="0" class="rain d5">ｻ ｼ ｽ ｾ 0 1 0 1 ｿ ﾀ ﾁ ﾂ 1 0</text>
    <text x="660" y="0" class="rain d4">1 0 ﾏ ﾐ ﾑ ﾒ ﾓ 1 0 1 0 ﾔ ﾕ ﾖ</text>
    <text x="700" y="0" class="rain d6">ﾊ ﾋ ﾌ ﾍ ﾎ 1 0 1 0 ﾏ ﾐ ﾑ ﾒ ﾓ</text>
    <text x="740" y="0" class="rain d1">0 1 0 1 ｻ ｼ ｽ ｾ 1 0 1 ｿ ﾀ ﾁ</text>
    <text x="780" y="0" class="rain d3">ｱ ｲ ｳ ｴ 1 0 1 ｶ ｷ ｸ ｹ 1 0 1</text>
  </g>

  <!-- Foreground Images (Centered exactly like your HTML div) -->
  
  <!-- Banner (Width 480, centered on an 800px canvas) -->
  <image href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/g4zwr-banner.svg" 
         xlink:href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/g4zwr-banner.svg" 
         x="160" y="40" width="480" />

  <!-- Bottom Row: Donut, Box, Pizza (Total width 600, centered) -->
  <image href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/Donut.svg" 
         xlink:href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/Donut.svg" 
         x="100" y="240" width="200" />
         
  <image href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/box.svg" 
         xlink:href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/box.svg" 
         x="300" y="240" width="200" />
         
  <image href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/pizza.svg" 
         xlink:href="https://raw.githack.com/g4zwr/g4zwr/refs/heads/main/pizza.svg" 
         x="500" y="240" width="200" />

</svg>
